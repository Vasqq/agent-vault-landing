<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AgentVault social card source</title>
  <link rel="stylesheet" href="../fonts/fonts.css">
  <style>
    /* Aerarium tokens (docs/revamp/REVAMP_SPEC.md section 3). */
    :root {
      --av-bg: #16130F;
      --av-bronze: #B08D57;
      --av-bronze-hi: #D8B67E;
      --av-verdigris: #6E9A8C;
      --av-digital: #5E8A7C;
      --av-text: #E8DFCC;
      --av-label: #7D9A8F;
      --av-line: rgba(176,141,87,0.26);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 1200px;
      height: 630px;
      background: var(--av-bg);
      overflow: hidden;
    }
    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: var(--av-bg);
    }
    /* Same layered figure as the page, sized to the card height. */
    .ascii {
      position: absolute;
      top: 0;
      right: -30px;
      width: calc(var(--cols) * 0.6em);
      height: calc(var(--rows) * 1em);
      font-size: 5.04px;
    }
    .ascii pre {
      position: absolute;
      inset: 0;
      margin: 0;
      font: 400 1em/1em "IBM Plex Mono", monospace;
      letter-spacing: 0;
      white-space: pre;
    }
    .dg { color: var(--av-digital); opacity: 0.8; }
    .lo { color: var(--av-verdigris); }
    .hi { color: var(--av-bronze-hi); }
    .copy {
      position: absolute;
      top: 56px;
      left: 64px;
      bottom: 56px;
      width: 680px;
      display: flex;
      flex-direction: column;
    }
    .wordmark {
      margin: 0;
      color: var(--av-bronze-hi);
      font: 600 26px/1 "Cormorant Garamond", Georgia, serif;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: auto 0 22px;
      color: var(--av-label);
      font: 400 13px/1.4 "IBM Plex Mono", monospace;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    .eyebrow::before {
      content: "";
      width: 40px;
      height: 1px;
      background: var(--av-bronze);
    }
    h1 {
      max-width: 600px;
      margin: 0 0 28px;
      color: var(--av-text);
      font: 500 74px/0.98 "Cormorant Garamond", Georgia, serif;
      letter-spacing: -0.01em;
    }
    h1 em { color: var(--av-bronze-hi); }
    .caps {
      margin: 0;
      color: var(--av-bronze-hi);
      font: 600 17px/1 "Cormorant Garamond", Georgia, serif;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }
    .caps span {
      margin: 0 0.4em;
      color: var(--av-bronze);
      font-size: 0.6em;
      vertical-align: 0.28em;
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- tests/render_social_card.js fills these layers from assets/ascii/temple-hero.json. -->
    <div class="ascii" data-ascii="temple-hero" style="--cols: 220; --rows: 125;">
      <pre class="dg"></pre><pre class="lo"></pre><pre class="hi"></pre>
    </div>
    <div class="copy">
      <p class="wordmark">AgentVault</p>
      <p class="eyebrow">Flare Summer Signal · Flare Confidential Compute Track</p>
      <h1>The authority layer between <em>AI agents and your money.</em></h1>
      <p class="caps">Private<span>&#9670;</span>Verifiable<span>&#9670;</span>Non-custodial</p>
    </div>
  </div>
</body>
</html>
